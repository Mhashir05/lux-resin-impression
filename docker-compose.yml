services:
  db:
    image: postgres:16
    container_name: lux-resin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: luxadmin
      POSTGRES_PASSWORD: luxpassword
      POSTGRES_DB: luxresin
    ports:
      - "5432:5432"
    volumes:
      - lux_data:/var/lib/postgresql/data

volumes:
  lux_data: